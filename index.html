const documentsByPartial={"1": "\u003c!doctype html>\u003chtml lang=\"es\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Fisica II\u003c/title>\u003cstyle>\r\n:root{--bg:#07101f;--p:#111b2e;--p2:#17243b;--tx:#edf2ff;--mut:#9aa9c4;--vio:#6d5dfc;--g:#22c55e;--y:#f5b21b;--r:#ef4444;--bd:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#14233d,#07101f 50%,#040713);color:var(--tx);font-family:Inter,system-ui,Segoe UI,Arial}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}aside{padding:24px;border-right:1px solid var(--bd);background:rgba(7,16,31,.75)}h1{margin:0;font-size:25px}.mut{color:var(--mut)}button,select{font:inherit}.btn{border:0;border-radius:14px;padding:13px 18px;color:#fff;background:linear-gradient(135deg,#5b55ff,#9b5cff);font-weight:800;cursor:pointer}.sec{background:#18243a;border:1px solid var(--bd);box-shadow:none}.good{background:linear-gradient(135deg,#16a34a,#4ade80)}.ok{background:linear-gradient(135deg,#d97706,#facc15)}.bad{background:linear-gradient(135deg,#dc2626,#f87171)}select{width:100%;margin:8px 0 14px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:#111b2e;color:white}.topic{display:flex;justify-content:space-between;margin:10px 0;color:#dbe5ff;font-size:14px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}.box{border:1px solid var(--bd);background:rgba(17,27,46,.8);border-radius:18px;padding:16px;margin-top:18px}main{padding:28px;max-width:1100px;width:100%;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:rgba(17,27,46,.8);border:1px solid var(--bd);border-radius:18px;padding:18px}.stat b{font-size:25px}.prog{height:12px;background:#283650;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#22c55e,#86efac)}.wrap{perspective:1200px;margin:22px 0}.card{position:relative;min-height:430px;transform-style:preserve-3d;transition:.5s}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;padding:32px;border:1px solid var(--bd);border-radius:24px;background:linear-gradient(180deg,rgba(23,36,59,.97),rgba(9,15,28,.97));backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;box-shadow:0 20px 60px #0008}.back{transform:rotateY(180deg)}.pill{position:absolute;top:20px;left:20px;background:#332b75;color:#c8bdff;border-radius:12px;padding:8px 12px;font-weight:800}.count{position:absolute;top:22px;right:22px;color:var(--mut)}.q{font-size:34px;line-height:1.25;max-width:850px}.a{font-size:28px;line-height:1.35;max-width:850px}.extra{margin-top:20px;max-width:780px;border:1px solid #22c55e66;background:#22c55e18;border-radius:16px;padding:16px;line-height:1.5}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}@media(max-width:850px){.app{grid-template-columns:1fr}aside{position:relative}.stats,.grid2{grid-template-columns:1fr}.q{font-size:26px}.a{font-size:22px}}\r\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"app\">\u003caside>\u003ch1>⚡ Tarjetas \u003c/h1>\u003cp class=\"mut\">Física II · Parcial 1\u003c/p>\u003cbutton class=\"btn\" style=\"width:100%\" onclick=\"newSession()\">+ Nueva sesión\u003c/button>\u003cp class=\"mut\">Tema\u003c/p>\u003cselect id=\"topic\" onchange=\"apply()\">\u003coption>Todos\u003c/option>\u003c/select>\u003cp class=\"mut\">Modo\u003c/p>\u003cselect id=\"mode\" onchange=\"apply()\">\u003coption value=\"smart\">Repaso inteligente\u003c/option>\u003coption value=\"weak\">Solo flojas\u003c/option>\u003coption value=\"random\">Aleatorio\u003c/option>\u003coption value=\"all\">Todas en orden\u003c/option>\u003c/select>\u003cdiv class=\"box\">\u003cb>🔥 Racha: \u003cspan id=\"streak\">0\u003c/span>\u003c/b>\u003cp class=\"mut\">Espacio: girar · 1 sé · 2 dudé · 3 no sé\u003c/p>\u003c/div>\u003cdiv class=\"box\">\u003cb>Temas\u003c/b>\u003cdiv id=\"topicStats\">\u003c/div>\u003c/div>\u003cbutton class=\"btn sec\" onclick=\"exportProgress()\">Exportar progreso\u003c/button> \u003cbutton class=\"btn sec\" onclick=\"resetProgress()\">Reiniciar\u003c/button>\u003c/aside>\u003cmain>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cspan class=\"mut\">Pregunta\u003c/span>\u003cbr>\u003cb>\u003cspan id=\"num\">1\u003c/span>/\u003cspan id=\"total\">0\u003c/span>\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003cspan class=\"mut\">Sesión\u003c/span>\u003cdiv class=\"prog\">\u003cdiv class=\"bar\" id=\"bar\">\u003c/div>\u003c/div>\u003cspan class=\"mut\" id=\"done\">0 respondidas\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cspan class=\"mut\">Aciertos\u003c/span>\u003cbr>\u003cb id=\"acc\">0%\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003cspan class=\"mut\">Tema actual\u003c/span>\u003cbr>\u003cb id=\"topicNow\" style=\"font-size:18px\">-\u003c/b>\u003c/div>\u003c/div>\u003cdiv class=\"wrap\">\u003cdiv class=\"card\" id=\"card\">\u003csection class=\"face\">\u003cdiv class=\"pill\" id=\"pill\">Tema\u003c/div>\u003cdiv class=\"count\" id=\"cnt\">Pregunta\u003c/div>\u003cdiv class=\"q\" id=\"q\">\u003c/div>\u003cbutton class=\"btn\" onclick=\"flip()\">Dar vuelta\u003c/button>\u003c/section>\u003csection class=\"face back\">\u003cdiv class=\"pill\" style=\"background:#153f2a;color:#86efac\">Respuesta\u003c/div>\u003cdiv class=\"count\" id=\"cnt2\">Respuesta\u003c/div>\u003cdiv class=\"a\" id=\"a\">\u003c/div>\u003cdiv class=\"extra\" id=\"extra\">\u003c/div>\u003c/section>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn sec\" onclick=\"flip()\">↻ Mostrar/Ocultar\u003c/button>\u003cbutton class=\"btn good\" onclick=\"grade('good')\">✓ La sé\u003c/button>\u003cbutton class=\"btn ok\" onclick=\"grade('ok')\">– Más o menos\u003c/button>\u003cbutton class=\"btn bad\" onclick=\"grade('bad')\">✕ No la sé\u003c/button>\u003c/div>\u003cdiv class=\"grid2\">\u003cdiv class=\"box\">\u003cb>🧠 Cómo funciona\u003c/b>\u003cp class=\"mut\">Las que falles vuelven pronto. Las que sabés se espacian. El progreso queda guardado en este navegador.\u003c/p>\u003c/div>\u003cdiv class=\"box\">\u003cb>📊 Estadísticas\u003c/b>\u003cp class=\"mut\" id=\"statsText\">\u003c/p>\u003c/div>\u003c/div>\u003c/main>\u003c/div>\u003cscript>\r\nconst CARDS=[{\"id\": 1, \"topic\": \"Electrización\", \"q\": \"¿Qué es la serie triboeléctrica?\", \"a\": \"Lista de materiales ordenados según su tendencia a perder o ganar electrones al ponerse en contacto y separarse.\", \"extra\": \"Los que pierden electrones quedan positivos; los que ganan quedan negativos.\"}, {\"id\": 2, \"topic\": \"Electrización\", \"q\": \"¿Qué es un ión?\", \"a\": \"Átomo que ganó o perdió electrones y dejó de ser neutro.\", \"extra\": \"Pierde electrones: catión. Gana electrones: anión.\"}, {\"id\": 3, \"topic\": \"Electrización\", \"q\": \"¿Qué significa que un cuerpo esté electrizado?\", \"a\": \"Tiene exceso o defecto de electrones, por lo tanto carga neta distinta de cero.\", \"extra\": \"Exceso: negativo. Defecto: positivo.\"}, {\"id\": 4, \"topic\": \"Electrización\", \"q\": \"¿Qué significa que la carga eléctrica esté cuantizada?\", \"a\": \"Que la carga solo puede ser múltiplo entero de la carga elemental; no hay fracciones de electrón.\", \"extra\": \"Q = n·e.\"}, {\"id\": 5, \"topic\": \"Electrización\", \"q\": \"¿Por qué se transfieren electrones y no protones?\", \"a\": \"Porque los electrones externos están menos ligados y pueden moverse; los protones están en el núcleo.\", \"extra\": \"Palabra clave: electrones de valencia.\"}, {\"id\": 6, \"topic\": \"Electrización\", \"q\": \"¿Qué dice la conservación de la carga?\", \"a\": \"La carga total de un sistema aislado se conserva: no se crea ni se destruye, solo se transfiere.\", \"extra\": \"Si uno gana electrones, otro los pierde.\"}, {\"id\": 7, \"topic\": \"Electrización\", \"q\": \"¿Qué es un catión?\", \"a\": \"Un átomo que perdió electrones y quedó positivo.\", \"extra\": \"No pierde protones.\"}, {\"id\": 8, \"topic\": \"Electrización\", \"q\": \"¿Qué es un anión?\", \"a\": \"Un átomo que ganó electrones y quedó negativo.\", \"extra\": \"Anión = adquiere electrones.\"}, {\"id\": 9, \"topic\": \"Ley de Coulomb\", \"q\": \"Enunciá la Ley de Coulomb.\", \"a\": \"La fuerza entre dos cargas puntuales en reposo es proporcional al producto de las cargas e inversamente proporcional al cuadrado de la distancia.\", \"extra\": \"F = k·|q1q2|/r².\"}, {\"id\": 10, \"topic\": \"Ley de Coulomb\", \"q\": \"Restricciones de la Ley de Coulomb.\", \"a\": \"Cargas puntuales, en reposo y fórmula con k=9×10⁹ válida en el vacío.\", \"extra\": \"P-R-V: puntuales, reposo, vacío.\"}, {\"id\": 11, \"topic\": \"Ley de Coulomb\", \"q\": \"¿Qué pasa si duplico la distancia entre dos cargas?\", \"a\": \"La fuerza queda en la cuarta parte.\", \"extra\": \"Porque depende de 1/r².\"}, {\"id\": 12, \"topic\": \"Ley de Coulomb\", \"q\": \"Compará Coulomb y gravedad.\", \"a\": \"Ambas dependen del producto de magnitudes y de 1/r². La gravedad siempre atrae; Coulomb atrae o repele.\", \"extra\": \"La eléctrica actúa entre cargas; la gravitatoria entre masas.\"}, {\"id\": 13, \"topic\": \"Campo eléctrico\", \"q\": \"¿Qué es el campo eléctrico?\", \"a\": \"Fuerza eléctrica por unidad de carga que experimentaría una carga de prueba positiva en un punto.\", \"extra\": \"Propiedad del espacio creada por una carga fuente.\"}, {\"id\": 14, \"topic\": \"Campo eléctrico\", \"q\": \"¿Por qué el campo no depende de la carga de prueba?\", \"a\": \"Porque lo genera la carga fuente; la carga de prueba solo sirve para medirlo y debe ser pequeña.\", \"extra\": \"Si fuera grande, modificaría el campo.\"}, {\"id\": 15, \"topic\": \"Campo eléctrico\", \"q\": \"Unidad del campo eléctrico.\", \"a\": \"N/C o V/m.\", \"extra\": \"Son equivalentes.\"}, {\"id\": 16, \"topic\": \"Campo eléctrico\", \"q\": \"Propiedades de las líneas de campo eléctrico.\", \"a\": \"Salen de cargas positivas, terminan en negativas, no se cruzan, son tangentes al campo y su densidad indica intensidad.\", \"extra\": \"Clave: positivo a negativo.\"}, {\"id\": 17, \"topic\": \"Campo eléctrico\", \"q\": \"¿Por qué las líneas de campo no se cruzan?\", \"a\": \"Porque en un punto el campo solo puede tener una dirección y un sentido.\", \"extra\": \"Si se cruzaran habría dos direcciones.\"}, {\"id\": 18, \"topic\": \"Campo eléctrico\", \"q\": \"Campo dentro de un conductor en equilibrio electrostático.\", \"a\": \"Es nulo: E = 0.\", \"extra\": \"Los electrones se redistribuyen en la superficie.\"}, {\"id\": 19, \"topic\": \"Campo eléctrico\", \"q\": \"¿Qué es una carga fuente?\", \"a\": \"La carga que genera el campo eléctrico.\", \"extra\": \"Fuente = crea.\"}, {\"id\": 20, \"topic\": \"Campo eléctrico\", \"q\": \"¿Qué es una carga de prueba?\", \"a\": \"Carga positiva muy pequeña usada para medir el campo sin modificarlo.\", \"extra\": \"Prueba = mide.\"}, {\"id\": 21, \"topic\": \"Campo eléctrico\", \"q\": \"¿Cómo se calcula el campo resultante de varias cargas?\", \"a\": \"Por superposición: se suman vectorialmente los campos producidos por cada carga.\", \"extra\": \"Palabra clave: suma vectorial.\"}, {\"id\": 22, \"topic\": \"Campo eléctrico\", \"q\": \"¿Qué significa campo uniforme?\", \"a\": \"Campo con mismo módulo, dirección y sentido en todos los puntos de una región.\", \"extra\": \"Ejemplo: capacitor ideal.\"}, {\"id\": 23, \"topic\": \"Gauss\", \"q\": \"¿Qué dice la Ley de Gauss?\", \"a\": \"El flujo eléctrico neto por una superficie cerrada es la carga encerrada dividida por la permitividad del vacío.\", \"extra\": \"Solo importa la carga encerrada.\"}, {\"id\": 24, \"topic\": \"Gauss\", \"q\": \"¿Qué es el flujo eléctrico?\", \"a\": \"Medida de cuántas líneas de campo atraviesan una superficie.\", \"extra\": \"Depende de E, área y ángulo con la normal.\"}, {\"id\": 25, \"topic\": \"Gauss\", \"q\": \"¿Qué es una superficie gaussiana?\", \"a\": \"Superficie cerrada e imaginaria elegida para aplicar la Ley de Gauss.\", \"extra\": \"Se elige con simetría.\"}, {\"id\": 26, \"topic\": \"Gauss\", \"q\": \"¿Las cargas externas afectan el flujo neto?\", \"a\": \"No, el flujo neto solo depende de la carga encerrada.\", \"extra\": \"Pueden afectar el campo en puntos, pero no el flujo neto.\"}, {\"id\": 27, \"topic\": \"Gauss\", \"q\": \"¿Para qué sirve la Ley de Gauss?\", \"a\": \"Para calcular el campo eléctrico fácilmente cuando hay simetría.\", \"extra\": \"Simetría esférica, cilíndrica o plana.\"}, {\"id\": 28, \"topic\": \"Gauss\", \"q\": \"Superficie para simetría esférica.\", \"a\": \"Una esfera.\", \"extra\": \"\"}, {\"id\": 29, \"topic\": \"Gauss\", \"q\": \"Superficie para simetría cilíndrica.\", \"a\": \"Un cilindro.\", \"extra\": \"\"}, {\"id\": 30, \"topic\": \"Gauss\", \"q\": \"Superficie para simetría plana.\", \"a\": \"Una pastilla gaussiana o cilindro corto con tapas.\", \"extra\": \"\"}, {\"id\": 31, \"topic\": \"Potencial\", \"q\": \"¿Qué es diferencia de potencial?\", \"a\": \"Trabajo o energía por unidad de carga necesario para mover una carga entre dos puntos.\", \"extra\": \"Compara A y B.\"}, {\"id\": 32, \"topic\": \"Potencial\", \"q\": \"Diferencia entre potencial y diferencia de potencial.\", \"a\": \"Potencial: energía por unidad de carga en un punto. Diferencia: cambio/trabajo por unidad de carga entre dos puntos.\", \"extra\": \"Potencial = un punto; diferencia = dos.\"}, {\"id\": 33, \"topic\": \"Potencial\", \"q\": \"¿Qué es una superficie equipotencial?\", \"a\": \"Superficie donde todos los puntos tienen el mismo potencial eléctrico.\", \"extra\": \"Mover una carga sobre ella no requiere trabajo.\"}, {\"id\": 34, \"topic\": \"Potencial\", \"q\": \"¿Campo cero significa equipotencial?\", \"a\": \"No necesariamente. Equipotencial significa mismo potencial, no campo nulo.\", \"extra\": \"Las equipotenciales son perpendiculares al campo.\"}, {\"id\": 35, \"topic\": \"Potencial\", \"q\": \"¿Cómo funciona un Van de Graaff?\", \"a\": \"Una cinta aislante transporta cargas a una esfera metálica, donde se acumulan y generan gran diferencia de potencial.\", \"extra\": \"Puede producir chispas.\"}, {\"id\": 36, \"topic\": \"Potencial\", \"q\": \"¿Qué es el efecto de punta?\", \"a\": \"Concentración de carga y campo en zonas puntiagudas de un conductor cargado.\", \"extra\": \"Pararrayos.\"}, {\"id\": 37, \"topic\": \"Dieléctricos\", \"q\": \"¿Qué es un dieléctrico?\", \"a\": \"Material aislante cuyos electrones están fuertemente ligados y no se mueven libremente.\", \"extra\": \"Puede polarizarse.\"}, {\"id\": 38, \"topic\": \"Dieléctricos\", \"q\": \"¿Qué significa polarización?\", \"a\": \"Separación u orientación de cargas positivas y negativas por acción de un campo, aunque el cuerpo siga neutro.\", \"extra\": \"No es lo mismo que electrización.\"}, {\"id\": 39, \"topic\": \"Dieléctricos\", \"q\": \"Diferencia entre electrizado y polarizado.\", \"a\": \"Electrizado: carga neta. Polarizado: cargas separadas/orientadas pero carga total cero.\", \"extra\": \"\"}, {\"id\": 40, \"topic\": \"Dieléctricos\", \"q\": \"¿Qué es un dieléctrico no polar?\", \"a\": \"Aislante cuyas moléculas no tienen momento dipolar permanente; el campo induce la polarización.\", \"extra\": \"No polar = el campo crea dipolos.\"}, {\"id\": 41, \"topic\": \"Dieléctricos\", \"q\": \"Polar vs no polar.\", \"a\": \"Polar: ya tiene dipolos permanentes y se orientan. No polar: no tiene dipolos permanentes, el campo los induce.\", \"extra\": \"Los dos son aislantes.\"}, {\"id\": 42, \"topic\": \"Dieléctricos\", \"q\": \"¿Qué mide la susceptibilidad eléctrica?\", \"a\": \"Cuánto se ordenan o alinean las moléculas de un dieléctrico ante un campo eléctrico.\", \"extra\": \"Pregunta marcada como probable.\"}, {\"id\": 43, \"topic\": \"Dipolo\", \"q\": \"¿Qué es un dipolo eléctrico?\", \"a\": \"Dos cargas iguales y opuestas separadas por una distancia.\", \"extra\": \"\"}, {\"id\": 44, \"topic\": \"Dipolo\", \"q\": \"¿Qué es el momento dipolar?\", \"a\": \"Magnitud vectorial que mide la separación entre dos cargas iguales y opuestas.\", \"extra\": \"p = q·d; apunta de negativa a positiva.\"}, {\"id\": 45, \"topic\": \"Capacitores\", \"q\": \"¿Qué es un capacitor?\", \"a\": \"Dispositivo con dos placas conductoras separadas por dieléctrico que almacena carga y energía en un campo eléctrico.\", \"extra\": \"\"}, {\"id\": 46, \"topic\": \"Capacitores\", \"q\": \"¿Qué mide la capacitancia?\", \"a\": \"Capacidad de almacenar carga por cada volt de diferencia de potencial.\", \"extra\": \"C = Q/V.\"}, {\"id\": 47, \"topic\": \"Capacitores\", \"q\": \"¿De qué depende la capacitancia de placas paralelas?\", \"a\": \"Área de placas, distancia entre ellas y dieléctrico.\", \"extra\": \"Más área aumenta C; más distancia disminuye C.\"}, {\"id\": 48, \"topic\": \"Capacitores\", \"q\": \"¿Qué pasa si aumenta la distancia entre placas?\", \"a\": \"La capacitancia disminuye.\", \"extra\": \"\"}, {\"id\": 49, \"topic\": \"Capacitores\", \"q\": \"¿Qué pasa si se agrega un dieléctrico?\", \"a\": \"La capacitancia aumenta.\", \"extra\": \"Se multiplica por K.\"}, {\"id\": 50, \"topic\": \"Capacitores\", \"q\": \"En serie, ¿qué es igual en todos los capacitores?\", \"a\": \"La carga.\", \"extra\": \"El voltaje se reparte.\"}, {\"id\": 51, \"topic\": \"Capacitores\", \"q\": \"En paralelo, ¿qué es igual en todos los capacitores?\", \"a\": \"El voltaje.\", \"extra\": \"La carga se reparte.\"}, {\"id\": 52, \"topic\": \"Capacitores\", \"q\": \"¿Qué es tau en RC?\", \"a\": \"Constante de tiempo τ = R·C; indica rapidez de carga/descarga.\", \"extra\": \"En τ carga 63,2%.\"}, {\"id\": 53, \"topic\": \"Capacitores\", \"q\": \"En t = τ, ¿qué porcentaje se cargó?\", \"a\": \"Aproximadamente 63,2% de la carga final.\", \"extra\": \"En descarga queda 36,8%.\"}, {\"id\": 54, \"topic\": \"Capacitores\", \"q\": \"Capacitor totalmente cargado en RC: ¿corriente?\", \"a\": \"La corriente es cero; se comporta como circuito abierto.\", \"extra\": \"\"}, {\"id\": 55, \"topic\": \"Corriente\", \"q\": \"Definí corriente eléctrica.\", \"a\": \"Flujo ordenado de cargas eléctricas que atraviesa una sección por unidad de tiempo.\", \"extra\": \"A = C/s.\"}, {\"id\": 56, \"topic\": \"Corriente\", \"q\": \"¿Qué es velocidad media de deriva?\", \"a\": \"Velocidad promedio neta de los electrones libres en un conductor debido a un campo eléctrico.\", \"extra\": \"Es muy pequeña.\"}, {\"id\": 57, \"topic\": \"Corriente\", \"q\": \"Conductividad vs resistividad.\", \"a\": \"Conductividad: facilidad para dejar pasar corriente. Resistividad: oposición al paso de corriente.\", \"extra\": \"Son inversas.\"}, {\"id\": 58, \"topic\": \"Corriente\", \"q\": \"Ley de Ohm.\", \"a\": \"La diferencia de potencial en una resistencia es proporcional a la corriente que circula por ella.\", \"extra\": \"V = R·I.\"}, {\"id\": 59, \"topic\": \"Corriente\", \"q\": \"Potencia general si no sé el componente.\", \"a\": \"P = V·I.\", \"extra\": \"Solo para resistencia podés usar I²R o V²/R.\"}, {\"id\": 60, \"topic\": \"Kirchhoff\", \"q\": \"Regla de los nodos.\", \"a\": \"En un nodo, la suma algebraica de corrientes que entran y salen es cero.\", \"extra\": \"Conservación de carga.\"}, {\"id\": 61, \"topic\": \"Kirchhoff\", \"q\": \"Regla de las mallas.\", \"a\": \"En una malla cerrada, la suma algebraica de diferencias de potencial es cero.\", \"extra\": \"Conservación de energía.\"}, {\"id\": 62, \"topic\": \"Kirchhoff\", \"q\": \"¿Cómo se conecta un voltímetro?\", \"a\": \"En paralelo con el componente.\", \"extra\": \"Mide diferencia de potencial.\"}, {\"id\": 63, \"topic\": \"Kirchhoff\", \"q\": \"¿Cómo se conecta un amperímetro?\", \"a\": \"En serie con el componente.\", \"extra\": \"Mide corriente.\"}, {\"id\": 64, \"topic\": \"Unidades\", \"q\": \"Unidad de densidad lineal λ.\", \"a\": \"C/m.\", \"extra\": \"Carga sobre longitud.\"}, {\"id\": 65, \"topic\": \"Unidades\", \"q\": \"Unidad de densidad superficial σ.\", \"a\": \"C/m².\", \"extra\": \"Carga sobre área.\"}, {\"id\": 66, \"topic\": \"Unidades\", \"q\": \"Unidad de densidad volumétrica ρ.\", \"a\": \"C/m³.\", \"extra\": \"Carga sobre volumen.\"}];let progress=JSON.parse(localStorage.getItem('Fisica II_v2')||'{}');let session={answered:0,correct:0,streak:0};let deck=[],current=null;const colors=['#60a5fa','#8b5cf6','#38bdf8','#f59e0b','#ef4444','#22c55e','#f472b6','#14b8a6'];function p(c){if(!progress[c.id])progress[c.id]={score:0,seen:0,right:0,wrong:0,next:0};return progress[c.id]}function save(){localStorage.setItem('Fisica II_v2',JSON.stringify(progress))}function init(){[...new Set(CARDS.map(c=>c.topic))].forEach(t=>{let o=document.createElement('option');o.textContent=t;document.getElementById('topic').appendChild(o)});build();next();render()}function score(c){let x=p(c),now=Date.now();return (x.wrong*5+(5-x.score)*2-x.right)*1e9-Math.max(0,x.next-now)+Math.random()*999}function available(){let cs=CARDS.filter(c=>topic.value==='Todos'||c.topic===topic.value);if(mode.value==='weak')cs=cs.filter(c=>p(c).wrong||p(c).score\u003c2);return cs}\nfunction build(){let cs=available(),m=mode.value;if(m==='random')cs.sort(()=>Math.random()-.5);else if(m!=='all')cs.sort((a,b)=>score(b)-score(a));deck=cs;total.textContent=cs.length}\nfunction next(){\nconst previousId=current?.id,eligible=available(),ids=new Set(eligible.map(c=>c.id));\ndeck=deck.filter(c=>ids.has(c.id));total.textContent=eligible.length;\nif(!deck.length)build();\nif(deck[0]?.id===previousId&&eligible.some(c=>c.id!==previousId)){\nif(!deck.some(c=>c.id!==previousId))build();\nconst i=deck.findIndex(c=>c.id!==previousId);deck.unshift(deck.splice(i,1)[0]);\n}\ncurrent=deck.shift();card.classList.remove('flip');\nif(!current){q.textContent='No hay tarjetas en este filtro.';a.textContent='';extra.textContent='';pill.textContent='';topicNow.textContent='-';num.textContent='0';cnt.textContent=cnt2.textContent='Sin tarjetas';render();return}\nq.textContent=current.q;a.textContent=current.a;extra.textContent=current.extra||'Marcá cómo te fue para optimizar el repaso.';pill.textContent=current.topic;topicNow.textContent=current.topic;num.textContent=session.answered+1;cnt.textContent='Pregunta '+(session.answered+1);cnt2.textContent=cnt.textContent;render()\n}\nfunction flip(){card.classList.toggle('flip')}function grade(g){if(!current)return;let x=p(current);x.seen++;let delay=2;if(g==='good'){x.score=Math.min(5,x.score+1);x.right++;session.correct++;session.streak++;delay=[20,60,180,720,1440,4320][x.score]||4320}else if(g==='ok'){x.score=Math.max(1,x.score);session.streak=0;delay=10}else{x.score=0;x.wrong++;session.streak=0;delay=2}x.next=Date.now()+delay*60000;session.answered++;save();\nconst eligible=available(),ids=new Set(eligible.map(c=>c.id));\ndeck=deck.filter(c=>ids.has(c.id)&&c.id!==current.id);\nif(g!=='good'&&ids.has(current.id)){\nif(!deck.length){build();deck=deck.filter(c=>c.id!==current.id)}\ndeck.splice(Math.min(g==='bad'?3:10,deck.length),0,current);\n}\nnext()}function render(){streak.textContent=session.streak;let ac=session.answered?Math.round(session.correct/session.answered*100):0;acc.textContent=ac+'%';done.textContent=session.answered+' respondidas';bar.style.width=Math.min(100,session.answered/25*100)+'%';let ts=[...new Set(CARDS.map(c=>c.topic))];topicStats.innerHTML='';ts.forEach((t,i)=>{let cs=CARDS.filter(c=>c.topic===t),r=0,s=0;cs.forEach(c=>{r+=p(c).right;s+=p(c).seen});topicStats.innerHTML+=`\u003cdiv class=\"topic\">\u003cspan>\u003cspan class=\"dot\" style=\"background:${colors[i%colors.length]}\">\u003c/span>${t}\u003c/span>\u003cspan>${r}/${Math.max(s,cs.length)}\u003c/span>\u003c/div>`});let seen=0,right=0,wrong=0;CARDS.forEach(c=>{seen+=p(c).seen;right+=p(c).right;wrong+=p(c).wrong});statsText.innerHTML=`Respondidas totales: \u003cb>${seen}\u003c/b>\u003cbr>Correctas: \u003cb>${right}\u003c/b>\u003cbr>Incorrectas: \u003cb>${wrong}\u003c/b>\u003cbr>Tarjetas cargadas: \u003cb>${CARDS.length}\u003c/b>`}function apply(){build();next()}function newSession(){session={answered:0,correct:0,streak:0};build();next()}function resetProgress(){if(confirm('¿Borrar progreso?')){progress={};save();newSession()}}function exportProgress(){let blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='progreso_Fisica II.json';a.click()}document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flip()}if(e.key==='1')grade('good');if(e.key==='2')grade('ok');if(e.key==='3')grade('bad')});init();\r\n\u003c/script>\u003c/body>\u003c/html>", "2": "\u003c!doctype html>\u003chtml lang=\"es\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Fisica II · 2º Parcial\u003c/title>\n\u003cstyle>\n:root{--bg:#070b14;--p:#765cff;--text:#f4f6ff;--muted:#a5b0c4;--panel:#111827;--line:#ffffff16}\n*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#152441,#070b14 45%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}\n.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}aside{padding:24px 20px;background:#080d18e8;border-right:1px solid var(--line)}main{width:min(1000px,100%);margin:auto;padding:26px}\nh1{font-size:23px;margin:0}.sub{color:var(--muted);margin:4px 0 24px}.btn,select{font:inherit}.btn{border:0;border-radius:13px;padding:13px 17px;color:#fff;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#6657ff,#955cff)}\nselect{width:100%;padding:11px;margin:7px 0 16px;background:#111a2b;color:white;border:1px solid var(--line);border-radius:11px}label{font-size:12px;color:var(--muted);text-transform:uppercase}\n.note{margin-top:16px;padding:14px;background:#111827;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.45}\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}.stat{background:#101827dd;border:1px solid var(--line);padding:15px;border-radius:15px}.stat small{color:var(--muted)}.stat b{display:block;font-size:23px;margin-top:4px}\n.prog{height:9px;background:#1d293d;border-radius:99px;overflow:hidden;margin-bottom:18px}.bar{height:100%;background:linear-gradient(90deg,#765cff,#22c55e);width:0}\n.flash{height:450px;perspective:1200px}.inner{height:100%;position:relative;transform-style:preserve-3d;transition:.48s}.inner.flip{transform:rotateY(180deg)}\n.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,#172238,#0d1422);box-shadow:0 25px 70px #0007;padding:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.back{transform:rotateY(180deg)}\n.tag{position:absolute;top:21px;left:21px;background:#765cff2e;color:#c4b5fd;padding:7px 11px;border-radius:9px;font-weight:800;font-size:13px}.star{position:absolute;top:17px;right:20px;border:0;background:none;color:#7d899e;font-size:28px;cursor:pointer}.star.on{color:#facc15}\n.q{font-size:31px;line-height:1.25;max-width:800px}.a{font-size:25px;line-height:1.36;max-width:800px}.extra{margin-top:19px;padding:14px 18px;border:1px solid #22c55e55;background:#22c55e12;border-radius:13px;color:#d9ffe4;max-width:760px}\n.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.g{border:0;border-radius:13px;padding:13px 17px;color:#fff;font-weight:800;cursor:pointer}.good{background:#16a34a}.mid{background:#ca8a04}.bad{background:#dc2626}.secondary{background:#1b2639;border:1px solid var(--line)}\n.topicstats{margin-top:15px}.tl{display:flex;justify-content:space-between;font-size:12px;color:#bac5d8;padding:5px 0}\n@media(max-width:800px){.app{display:block}.stats{grid-template-columns:1fr 1fr}main{padding:15px}.flash{height:490px}.q{font-size:25px}.a{font-size:21px}}\n.face{overflow-y:auto;justify-content:safe center;padding-top:68px;padding-bottom:26px}.q,.a,.extra{flex-shrink:0;overflow-wrap:anywhere}@media(max-width:480px){.face{padding-left:18px;padding-right:18px}.q{font-size:23px}.a{font-size:20px}.extra{font-size:15px}.tag{max-width:calc(100% - 85px)}}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"app\">\u003caside>\u003ch1>🧲 Tarjetas\u003c/h1>\u003cdiv class=\"sub\">Física II · Parcial 2\u003c/div>\n\u003cbutton class=\"btn\" style=\"width:100%\" onclick=\"newSession()\">Nueva sesión\u003c/button>\u003cbr>\u003cbr>\n\u003clabel>Tema\u003c/label>\u003cselect id=\"topic\" onchange=\"rebuild()\">\u003coption>Todos\u003c/option>\u003c/select>\n\u003clabel>Modo\u003c/label>\u003cselect id=\"mode\" onchange=\"rebuild()\">\u003coption value=\"smart\">🧠 Repaso inteligente\u003c/option>\u003coption value=\"weak\">🎯 Solo flojas\u003c/option>\u003coption value=\"fav\">⭐ Favoritas\u003c/option>\u003coption value=\"exam\">📝 Simulacro mezclado\u003c/option>\u003coption value=\"order\">📚 En orden\u003c/option>\u003c/select>\n\u003cdiv class=\"note\">\u003cb>⌨️ Atajos\u003c/b>\u003cbr>Espacio: dar vuelta\u003cbr>1: La sé · 2: Más o menos · 3: No la sé\u003cbr>F: favorita\u003c/div>\n\u003cdiv class=\"note\">\u003cb>Base oficial actual\u003c/b>\u003cbr>Apunte desde la página 17 y preguntas de clase. Incluye solenoides, inducción e inductancia. Circuitos RL al final: solo teoría, sin ejercicios ni demostraciones.\u003c/div>\u003cdiv class=\"topicstats\" id=\"topicstats\">\u003c/div>\n\u003c/aside>\u003cmain>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003csmall>Respondidas\u003c/small>\u003cb id=\"answered\">0\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Aciertos\u003c/small>\u003cb id=\"acc\">0%\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Racha\u003c/small>\u003cb id=\"streak\">🔥 0\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003csmall>Tarjetas\u003c/small>\u003cb id=\"total\">0\u003c/b>\u003c/div>\u003c/div>\u003cdiv class=\"prog\">\u003cdiv class=\"bar\" id=\"bar\">\u003c/div>\u003c/div>\n\u003cdiv class=\"flash\">\u003cdiv class=\"inner\" id=\"inner\">\u003cdiv class=\"face\">\u003cdiv class=\"tag\" id=\"tag\">\u003c/div>\u003cbutton class=\"star\" id=\"s1\" onclick=\"fav()\">☆\u003c/button>\u003cdiv class=\"q\" id=\"q\">\u003c/div>\u003cbr>\u003cbutton class=\"btn\" onclick=\"flip()\">Mostrar respuesta\u003c/button>\u003c/div>\u003cdiv class=\"face back\">\u003cdiv class=\"tag\">Respuesta\u003c/div>\u003cbutton class=\"star\" id=\"s2\" onclick=\"fav()\">☆\u003c/button>\u003cdiv class=\"a\" id=\"a\">\u003c/div>\u003cdiv class=\"extra\" id=\"extra\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"controls\">\u003cbutton class=\"g secondary\" onclick=\"flip()\">↻ Dar vuelta\u003c/button>\u003cbutton class=\"g good\" onclick=\"grade(2)\">✓ La sé\u003c/button>\u003cbutton class=\"g mid\" onclick=\"grade(1)\">~ Más o menos\u003c/button>\u003cbutton class=\"g bad\" onclick=\"grade(0)\">✕ No la sé\u003c/button>\u003c/div>\n\u003c/main>\u003c/div>\u003cscript>\nconst cards=[{\"id\": 1, \"topic\": \"Magnetismo\", \"q\": \"¿Qué es el campo magnético?\", \"a\": \"Es una propiedad de la naturaleza cuyo origen se debe al movimiento de cargas eléctricas y se describe mediante el vector campo magnético B.\", \"extra\": \"Base: pág. 17.\"}, {\"id\": 2, \"topic\": \"Magnetismo\", \"q\": \"¿Qué es un imán?\", \"a\": \"Es un cuerpo que posee un campo magnético significativo.\", \"extra\": \"\"}, {\"id\": 3, \"topic\": \"Magnetismo\", \"q\": \"¿Existen monopolos magnéticos?\", \"a\": \"En el electromagnetismo clásico habitual no hay polos magnéticos aislados: los imanes tienen norte y sur.\", \"extra\": \"La ley de Gauss magnética lo expresa: ∮ B·dA = 0. Cortar un imán produce nuevos dipolos; no demuestra que los monopolos sean lógicamente imposibles.\"}, {\"id\": 4, \"topic\": \"Magnetismo\", \"q\": \"¿Qué expresa la Ley de Gauss para el magnetismo?\", \"a\": \"Que para cualquier superficie cerrada el flujo magnético que sale es igual al que ingresa; por lo tanto, el flujo magnético neto es cero.\", \"extra\": \"\"}, {\"id\": 5, \"topic\": \"Magnetismo\", \"q\": \"¿Cuál es la unidad del campo magnético B?\", \"a\": \"Tesla (T): 1 T = 1 N/(A·m) = 1 N·s/(C·m).\", \"extra\": \"Un campo de 1 T ejerce 1 N sobre una carga de 1 C que se mueve a 1 m/s perpendicularmente al campo.\"}, {\"id\": 6, \"topic\": \"Magnetismo\", \"q\": \"¿Cómo se clasifican los materiales según su comportamiento frente a un campo magnético?\", \"a\": \"Ferromagnéticos: respuesta fuerte y posible magnetización remanente. Paramagnéticos: atracción débil. Diamagnéticos: repulsión débil.\", \"extra\": \"Ejemplos: hierro, aluminio y cobre, respectivamente. La atracción o repulsión neta se observa en campos no uniformes.\"}, {\"id\": 50, \"topic\": \"Magnetismo\", \"q\": \"¿Cómo se define B mediante la fuerza sobre una carga móvil?\", \"a\": \"Por F⃗ = q(v⃗ × B⃗). Si v es perpendicular a B, su módulo es B = F/(|q|v).\", \"extra\": \"Para un ángulo general: B = F/(|q|v sen θ), si sen θ ≠ 0.\"}, {\"id\": 51, \"topic\": \"Magnetismo\", \"q\": \"¿Qué información aportan las líneas de campo magnético?\", \"a\": \"La tangente indica la dirección de B y las flechas su sentido. Una mayor densidad de líneas representa mayor intensidad.\", \"extra\": \"No se cruzan. En un imán de barra forman lazos: afuera van de norte a sur y adentro de sur a norte.\"}, {\"id\": 52, \"topic\": \"Magnetismo\", \"q\": \"¿Cómo responden los materiales diamagnéticos y paramagnéticos?\", \"a\": \"Los diamagnéticos inducen una magnetización opuesta al campo aplicado; los paramagnéticos, una débil magnetización a favor.\", \"extra\": \"En ambos casos usuales la respuesta desaparece al retirar el campo. El diamagnetismo no significa ausencia de respuesta.\"}, {\"id\": 53, \"topic\": \"Magnetismo\", \"q\": \"¿Qué distingue a un material ferromagnético?\", \"a\": \"Posee dominios magnéticos cuya orientación puede producir una magnetización muy intensa. Puede conservar parte de ella al retirar el campo.\", \"extra\": \"Remanencia: magnetización que persiste. No todos los objetos de hierro están inicialmente imantados.\"}, {\"id\": 7, \"topic\": \"Fuerza magnética\", \"q\": \"¿De qué depende la fuerza magnética sobre una carga en movimiento?\", \"a\": \"La fuerza es F⃗ = q(v⃗ × B⃗); su módulo es F = |q|vB sen(θ).\", \"extra\": \"Para que sea distinta de cero: q ≠ 0, B ≠ 0 y una componente de velocidad perpendicular a B.\"}, {\"id\": 8, \"topic\": \"Fuerza magnética\", \"q\": \"¿Cuándo es nula la fuerza magnética y cuándo es máxima?\", \"a\": \"F = |q|vB sen θ. Es nula si la carga está quieta o se mueve paralela o antiparalela a B. Es máxima si v es perpendicular a B.\", \"extra\": \"La comparación supone los mismos |q|, v y B. También es nula si q = 0 o B = 0.\"}, {\"id\": 10, \"topic\": \"Fuerza magnética\", \"q\": \"¿Cómo se determina la dirección y el sentido de la fuerza magnética?\", \"a\": \"La fuerza es perpendicular a v y a B. La mano derecha indica el sentido de v⃗ × B⃗ para una carga positiva; para una negativa se invierte.\", \"extra\": \"F⃗ = q(v⃗ × B⃗). Cambiar el signo de la carga invierte el sentido de la fuerza.\"}, {\"id\": 54, \"topic\": \"Fuerza magnética\", \"q\": \"¿El campo magnético realiza trabajo sobre una carga?\", \"a\": \"La fuerza magnética no realiza trabajo porque siempre es perpendicular a la velocidad.\", \"extra\": \"F⃗·v⃗ = 0. Por sí sola no modifica la energía cinética; sí puede cambiar la dirección del movimiento.\"}, {\"id\": 12, \"topic\": \"Movimiento en B\", \"q\": \"¿Qué trayectoria describe una carga que entra perpendicularmente en B uniforme y por qué?\", \"a\": \"Describe una circunferencia: la fuerza magnética actúa como fuerza centrípeta, cambiando la dirección sin cambiar la rapidez.\", \"extra\": \"Si solo actúa la fuerza magnética: |q|vB = mv²/r, de donde r = mv/(|q|B).\"}, {\"id\": 14, \"topic\": \"Movimiento en B\", \"q\": \"¿De qué depende el radio de la trayectoria circular?\", \"a\": \"r = mv/(|q|B). Aumenta con la masa o la rapidez y disminuye al aumentar el módulo de la carga o el campo.\", \"extra\": \"Las comparaciones mantienen las otras magnitudes constantes. Supone v perpendicular a B uniforme y régimen no relativista.\"}, {\"id\": 17, \"topic\": \"Movimiento en B\", \"q\": \"¿Qué ocurre con el giro si se cambia el signo de la carga?\", \"a\": \"Se invierte el sentido de giro.\", \"extra\": \"\"}, {\"id\": 18, \"topic\": \"Movimiento en B\", \"q\": \"¿Cuándo se produce una trayectoria helicoidal?\", \"a\": \"Cuando la velocidad tiene una componente paralela y otra perpendicular al campo magnético.\", \"extra\": \"\"}, {\"id\": 19, \"topic\": \"Movimiento en B\", \"q\": \"¿De qué depende el período de rotación? ¿Depende del radio o la rapidez?\", \"a\": \"T = 2πm/(|q|B): depende de la masa, el módulo de la carga y el campo; no del radio ni de la rapidez.\", \"extra\": \"Válido para B uniforme en el régimen no relativista. Esta independencia permite sincronizar el ciclotrón.\"}, {\"id\": 21, \"topic\": \"Ciclotrón\", \"q\": \"¿Qué es un ciclotrón y cómo funciona?\", \"a\": \"Acelera partículas cargadas: el campo eléctrico aumenta su rapidez entre las DES y el magnético produce semicircunferencias dentro de ellas.\", \"extra\": \"Al ganar rapidez aumenta el radio. B curva la trayectoria, pero no aporta energía cinética.\"}, {\"id\": 22, \"topic\": \"Ciclotrón\", \"q\": \"¿Qué son las DES y dónde actúa el campo eléctrico acelerador?\", \"a\": \"Son cajas metálicas huecas con forma de D. En el modelo ideal no hay campo eléctrico acelerador dentro; actúa en el espacio entre ambas.\", \"extra\": \"Las DES se conectan a una tensión alterna y están en una región con B perpendicular a su plano.\"}, {\"id\": 25, \"topic\": \"Ciclotrón\", \"q\": \"¿Qué ocurre al completar una semicircunferencia?\", \"a\": \"La tensión cambia de polaridad para que el campo eléctrico acelere otra vez a la partícula al cruzar el espacio entre las DES.\", \"extra\": \"Dentro de cada D, el campo magnético solo curva el movimiento.\"}, {\"id\": 55, \"topic\": \"Ciclotrón\", \"q\": \"¿Qué frecuencia necesita el ciclotrón y por qué puede mantenerse fija?\", \"a\": \"f = |q|B/(2πm). En el régimen no relativista no depende del radio ni de la rapidez, lo que permite sincronizar una tensión de frecuencia fija.\", \"extra\": \"Para una misma partícula, aumentar B aumenta f. La polaridad cambia tras cada semicircunferencia.\"}, {\"id\": 27, \"topic\": \"Thomson y espectrómetro\", \"q\": \"¿Qué determinó Thomson y por qué fue fundamental su experimento?\", \"a\": \"Determinó e/m de los rayos catódicos y aportó evidencia de partículas negativas comunes a distintos materiales: los electrones.\", \"extra\": \"Mostró que el átomo tenía componentes internos. La relación e/m no dependía del material del cátodo.\"}, {\"id\": 28, \"topic\": \"Thomson y espectrómetro\", \"q\": \"¿Quién desarrolló el espectrómetro de masas mencionado en las notas?\", \"a\": \"Francis Aston.\", \"extra\": \"Las notas mencionan el Premio Nobel de Química de 1922.\"}, {\"id\": 29, \"topic\": \"Thomson y espectrómetro\", \"q\": \"¿Qué velocidad deben tener los iones que atraviesan el selector?\", \"a\": \"v = E/B₁, cuando las fuerzas eléctrica y magnética son opuestas y se equilibran.\", \"extra\": \"qE = qvB₁. Los campos y la velocidad son mutuamente perpendiculares.\"}, {\"id\": 31, \"topic\": \"Thomson y espectrómetro\", \"q\": \"¿Qué campo actúa en el deflector del espectrómetro y cómo desvía los iones?\", \"a\": \"Solo actúa B₂. Los iones describen arcos circulares de radio r = mv/(|q|B₂).\", \"extra\": \"Con velocidad y carga conocidas, el radio permite determinar la masa; en general se distingue m/|q|.\"}, {\"id\": 56, \"topic\": \"Thomson y espectrómetro\", \"q\": \"¿Cómo se obtiene e/m combinando campos eléctricos y magnéticos?\", \"a\": \"Se equilibran fuerzas para hallar v = E/B. Luego, con desviación solo magnética, se mide r y se usa e/m = v/(Br).\", \"extra\": \"Si el mismo B se usa en ambas etapas: e/m = E/(B²r). Se mide una relación, no e y m por separado.\"}, {\"id\": 58, \"topic\": \"Thomson y espectrómetro\", \"q\": \"¿Para qué sirve un espectrómetro de masas?\", \"a\": \"Para separar e identificar iones según su relación masa/carga y estudiar la composición de una muestra, incluidos sus isótopos.\", \"extra\": \"Conocida la carga, puede determinarse la masa a partir de la desviación.\"}, {\"id\": 59, \"topic\": \"Thomson y espectrómetro\", \"q\": \"¿Por qué hay que ionizar las partículas antes de analizarlas?\", \"a\": \"Para darles carga eléctrica, de modo que los campos eléctricos y magnéticos puedan acelerarlas, seleccionarlas y desviarlas.\", \"extra\": \"Una partícula neutra no experimenta la fuerza q(v⃗ × B⃗) usada en este modelo.\"}, {\"id\": 32, \"topic\": \"Conductores y espiras\", \"q\": \"¿Cuál es la expresión de la fuerza magnética sobre un conductor recto con corriente?\", \"a\": \"F = I·L·B·sen(θ).\", \"extra\": \"\"}, {\"id\": 33, \"topic\": \"Conductores y espiras\", \"q\": \"¿Qué puede ocurrir con las fuerzas en lados opuestos de una espira dentro de B?\", \"a\": \"Pueden ser iguales y opuestas: la fuerza neta se anula, pero producen un momento o torque.\", \"extra\": \"\"}, {\"id\": 34, \"topic\": \"Conductores y espiras\", \"q\": \"¿Qué es el momento dipolar magnético de una espira?\", \"a\": \"El producto de la corriente por el área de la espira.\", \"extra\": \"μ = I·A; para N vueltas, μ = N·I·A.\"}, {\"id\": 35, \"topic\": \"Conductores y espiras\", \"q\": \"¿Cuál es la expresión del torque sobre una espira?\", \"a\": \"El módulo del torque es τ = μB sen(θ).\", \"extra\": \"θ es el ángulo entre B y el momento magnético μ⃗, perpendicular al plano de la espira. Vectorialmente: τ⃗ = μ⃗ × B⃗.\"}, {\"id\": 36, \"topic\": \"Conductores y espiras\", \"q\": \"¿Qué aplicación aparece asociada al torque sobre espiras?\", \"a\": \"El motor de corriente continua.\", \"extra\": \"Base: pág. 22.\"}, {\"id\": 38, \"topic\": \"Fuentes de B\", \"q\": \"¿Qué establece Biot–Savart y cómo se aplica para calcular B?\", \"a\": \"Cada elemento de corriente aporta dB⃗ = (μ₀I/4π)(dℓ⃗ × r̂)/r². Se suman vectorialmente los aportes mediante una integral sobre el conductor.\", \"extra\": \"Para corrientes estacionarias en el vacío: identificar geometría, dirección de los aportes y simetrías; luego integrar.\"}, {\"id\": 39, \"topic\": \"Fuentes de B\", \"q\": \"¿Qué ocurre entre dos conductores recorridos por corriente?\", \"a\": \"Cada conductor genera un campo que ejerce una fuerza sobre la corriente del otro.\", \"extra\": \"En conductores paralelos: corrientes del mismo sentido se atraen; de sentidos opuestos se repelen.\"}, {\"id\": 40, \"topic\": \"Fuentes de B\", \"q\": \"¿Qué configuraciones se estudian como fuentes de campo magnético?\", \"a\": \"Conductores rectilíneos, espiras, solenoides y toroides. También se estudia la interacción entre dos conductores con corriente.\", \"extra\": \"La geometría y la corriente determinan la distribución del campo. Base: páginas 22–23.\"}, {\"id\": 60, \"topic\": \"Fuentes de B\", \"q\": \"¿Cómo es el campo alrededor de un conductor rectilíneo largo?\", \"a\": \"Sus líneas son circunferencias alrededor del alambre. En el vacío: B = μ₀I/(2πr).\", \"extra\": \"Aumenta con la corriente y disminuye con la distancia r. Es una aproximación lejos de los extremos.\"}, {\"id\": 61, \"topic\": \"Fuentes de B\", \"q\": \"¿Cómo se determina el sentido del campo de un alambre?\", \"a\": \"Con la mano derecha: el pulgar apunta en el sentido de la corriente convencional y los dedos rodean el alambre en el sentido de B.\", \"extra\": \"Si se invierte la corriente, se invierte el campo.\"}, {\"id\": 62, \"topic\": \"Fuentes de B\", \"q\": \"¿Qué establece la ley de Ampère en magnetostática?\", \"a\": \"La circulación de B sobre una curva cerrada es μ₀ veces la corriente neta encerrada: ∮ B⃗·dℓ⃗ = μ₀Ienc.\", \"extra\": \"Permite calcular B fácilmente cuando hay suficiente simetría; aquí se considera el vacío.\"}, {\"id\": 63, \"topic\": \"Fuentes de B\", \"q\": \"¿Qué es un toroide y cómo es su campo ideal?\", \"a\": \"Es un solenoide cerrado sobre sí mismo. Su campo sigue circunferencias dentro del devanado: B(r) = μ₀NI/(2πr).\", \"extra\": \"Para el modelo ideal con aire o vacío, el campo exterior se aproxima a cero.\"}, {\"id\": 64, \"topic\": \"Solenoide\", \"q\": \"¿Qué es un solenoide?\", \"a\": \"Un alambre enrollado en muchas espiras sucesivas que, al conducir corriente, genera un campo magnético.\", \"extra\": \"Los campos de las espiras se superponen. Su eje atraviesa los centros de las vueltas.\"}, {\"id\": 65, \"topic\": \"Solenoide\", \"q\": \"¿Cómo es el campo dentro y fuera de un solenoide largo?\", \"a\": \"En la región interior central es aproximadamente uniforme y paralelo al eje. Cerca de las bocas disminuye; afuera es débil.\", \"extra\": \"En uno real el campo exterior no es exactamente cero. Uniforme significa casi el mismo vector B en distintos puntos.\"}, {\"id\": 66, \"topic\": \"Solenoide\", \"q\": \"¿Cómo se interpreta el gráfico de B sobre el eje de un solenoide largo?\", \"a\": \"Muestra una meseta central con B ≈ μ₀nI. En el centro de cada boca B ≈ μ₀nI/2; al alejarse por fuera tiende a cero.\", \"extra\": \"CLAVE DEL PARCIAL: la curva indica intensidad según la posición, no una línea de campo. n = N/ℓ; aproximaciones para un solenoide largo con aire o vacío.\"}, {\"id\": 68, \"topic\": \"Solenoide\", \"q\": \"¿Cómo se calcula el campo de un solenoide real de longitud finita?\", \"a\": \"Se suman, mediante Biot–Savart, los campos de sus espiras. El resultado depende de la posición y de la geometría.\", \"extra\": \"μ₀nI aproxima la región central de uno largo; no es una fórmula exacta para cualquier punto de uno finito.\"}, {\"id\": 69, \"topic\": \"Solenoide\", \"q\": \"¿De qué depende el campo interior de un solenoide largo?\", \"a\": \"De la corriente I, las vueltas por metro n y el material del núcleo. Para aire: B ≈ μ₀nI.\", \"extra\": \"Duplicar I o n duplica B bajo estas condiciones. Estirarlo con N fija reduce n, si sigue siendo largo.\"}, {\"id\": 70, \"topic\": \"Solenoide\", \"q\": \"¿Cómo se determina el sentido de B dentro del solenoide?\", \"a\": \"Los dedos de la mano derecha siguen la corriente por las vueltas y el pulgar indica el campo interior.\", \"extra\": \"El extremo hacia el que apunta el pulgar es el polo norte de la bobina.\"}, {\"id\": 71, \"topic\": \"Solenoide\", \"q\": \"¿Qué aplicaciones tienen los solenoides?\", \"a\": \"Electroimanes, relés, electroválvulas y actuadores que convierten una señal eléctrica en movimiento.\", \"extra\": \"Una bobina con corriente puede atraer un núcleo móvil y abrir una válvula o accionar un contacto.\"}, {\"id\": 43, \"topic\": \"Faraday y Lenz\", \"q\": \"¿Qué observó Faraday al mover un imán permanente dentro de una espira conductora?\", \"a\": \"Que aparece una FEM inducida en la espira.\", \"extra\": \"\"}, {\"id\": 44, \"topic\": \"Faraday y Lenz\", \"q\": \"¿Cuándo aparecen FEM y corriente inducida? ¿Son lo mismo?\", \"a\": \"Una variación del flujo puede producir FEM. Para que circule corriente debe existir además un camino conductor cerrado.\", \"extra\": \"Puede existir FEM sin corriente. En una espira fija, B variable genera un campo eléctrico inducido que impulsa las cargas.\"}, {\"id\": 45, \"topic\": \"Faraday y Lenz\", \"q\": \"¿De qué depende la FEM inducida?\", \"a\": \"La FEM es la rapidez de cambio del flujo enlazado, con signo opuesto: ε = −N·dΦB/dt.\", \"extra\": \"Para N espiras con el mismo flujo por espira. Se mide en voltios; el signo expresa la ley de Lenz.\"}, {\"id\": 46, \"topic\": \"Faraday y Lenz\", \"q\": \"¿Qué dice Lenz y qué significa el signo negativo de Faraday?\", \"a\": \"La corriente inducida produce un campo que se opone a la variación del flujo que la genera. Esa oposición se expresa con el signo negativo.\", \"extra\": \"Se opone al CAMBIO: si el flujo aumenta, intenta reducir el aumento; si disminuye, intenta sostenerlo.\"}, {\"id\": 72, \"topic\": \"Faraday y Lenz\", \"q\": \"¿Qué es el flujo magnético y cómo se calcula?\", \"a\": \"Mide el campo que atraviesa una superficie orientada: ΦB = ∫ B⃗·dA⃗. Para B uniforme y superficie plana: ΦB = BA cos θ.\", \"extra\": \"θ es el ángulo con la NORMAL a la superficie. Unidad: weber (Wb) = T·m².\"}, {\"id\": 73, \"topic\": \"Faraday y Lenz\", \"q\": \"¿Qué debe cambiar para que haya inducción? ¿Puede B ser constante?\", \"a\": \"Debe variar el flujo. Puede cambiar B, el área o la orientación, o moverse la espira entre regiones con distinto campo.\", \"extra\": \"Sí puede haber inducción con B constante si cambia el área o la orientación. Una espira inmóvil con flujo constante no presenta FEM por ese mecanismo.\"}, {\"id\": 74, \"topic\": \"Faraday y Lenz\", \"q\": \"¿Por qué un cambio de flujo puede inducir una FEM?\", \"a\": \"Faraday es una ley experimental. En una espira fija, un B variable produce un campo eléctrico inducido que puede impulsar cargas.\", \"extra\": \"Si el conductor se mueve en B, la fuerza magnética sobre sus cargas puede originar FEM de movimiento.\"}, {\"id\": 75, \"topic\": \"Faraday y Lenz\", \"q\": \"¿Cómo se relaciona la inducción con la generación eléctrica?\", \"a\": \"Un generador usa movimiento para variar el flujo y producir una FEM. Con un circuito cerrado puede entregar corriente y energía eléctrica.\", \"extra\": \"La energía proviene del trabajo mecánico que mueve el generador; el campo magnético no crea energía.\"}, {\"id\": 77, \"topic\": \"Inductancia y energía\", \"q\": \"¿Qué es la autoinducción?\", \"a\": \"Al cambiar la corriente de una bobina cambia su propio flujo magnético y aparece una FEM que se opone a ese cambio de corriente.\", \"extra\": \"Para L constante: εL = −L·di/dt. Se opone al cambio, no necesariamente al sentido de la corriente.\"}, {\"id\": 78, \"topic\": \"Inductancia y energía\", \"q\": \"¿Qué representa la inductancia L y qué unidad tiene?\", \"a\": \"Mide el flujo enlazado por unidad de corriente en un sistema lineal: L = NΦB/I. Se mide en henrios (H).\", \"extra\": \"1 H = 1 V·s/A. Cuanto mayor es L, mayor FEM se requiere para la misma rapidez de cambio de corriente.\"}, {\"id\": 79, \"topic\": \"Inductancia y energía\", \"q\": \"¿De qué depende la inductancia de un solenoide largo?\", \"a\": \"De su geometría, número de vueltas y núcleo. Para aire: L ≈ μ₀N²A/ℓ.\", \"extra\": \"A es el área transversal y ℓ la longitud. Se supone un solenoide largo y un comportamiento lineal.\"}, {\"id\": 80, \"topic\": \"Inductancia y energía\", \"q\": \"¿Qué significa “cargar” un inductor y dónde almacena su energía?\", \"a\": \"Significa establecer corriente y almacenar energía en su campo magnético: U = ½LI² para un inductor lineal.\", \"extra\": \"No acumula carga como un capacitor. La fuente aporta la energía; al disminuir la corriente, el inductor puede devolverla al circuito.\"}, {\"id\": 81, \"topic\": \"Inductancia y energía\", \"q\": \"¿Qué significa la densidad de energía magnética?\", \"a\": \"Es la energía almacenada por unidad de volumen. En el vacío: u = B²/(2μ₀).\", \"extra\": \"Se mide en J/m³. Un campo más intenso almacena mayor energía por volumen.\"}, {\"id\": 82, \"topic\": \"Circuitos RL · teoría\", \"q\": \"¿Qué caracteriza a un circuito RL en corriente continua?\", \"a\": \"Contiene resistencia e inductancia. Tras conectar o desconectar la fuente presenta un transitorio: la corriente cambia gradualmente.\", \"extra\": \"El inductor se opone a cambios de corriente. Con una fuente continua estable, se alcanza un régimen permanente.\"}, {\"id\": 83, \"topic\": \"Circuitos RL · teoría\", \"q\": \"¿Cómo crece la corriente al conectar una fuente continua?\", \"a\": \"Si parte de cero: i(t) = (V/R)(1 − e^(−t/τ)). Crece rápidamente al principio y luego se acerca a V/R.\", \"extra\": \"τ = L/R. Modelo: fuente ideal, resistencia total R e inductancia constante L; no se requieren ejercicios numéricos.\"}, {\"id\": 84, \"topic\": \"Circuitos RL · teoría\", \"q\": \"¿Por qué la corriente del inductor no salta instantáneamente?\", \"a\": \"Porque vL = L·di/dt: un salto instantáneo exigiría una tensión ilimitada en el modelo ideal.\", \"extra\": \"Con tensiones finitas: i(0⁺) = i(0⁻). Si antes era cero, justo después de conectar sigue siendo cero.\"}, {\"id\": 85, \"topic\": \"Circuitos RL · teoría\", \"q\": \"¿Qué significa τ = L/R y cuándo termina aproximadamente el transitorio?\", \"a\": \"τ mide qué tan rápido cambia la corriente. A t = τ, el crecimiento desde cero alcanza el 63,2 % del valor final; en la caída queda el 36,8 % del inicial.\", \"extra\": \"Mayor τ significa un cambio más lento. Después de unas 5τ el cambio está prácticamente completo; la llegada exacta es asintótica.\"}, {\"id\": 87, \"topic\": \"Circuitos RL · teoría\", \"q\": \"¿Cómo se reparten las tensiones al conectar una fuente?\", \"a\": \"Desde corriente inicial nula: al principio vR = 0 y vL = V. Luego vR aumenta y vL disminuye.\", \"extra\": \"En régimen permanente ideal: i = V/R, vR = V y vL = 0. Las tensiones cumplen V = vR + vL.\"}, {\"id\": 88, \"topic\": \"Circuitos RL · teoría\", \"q\": \"¿Cómo se comporta el inductor ideal en régimen permanente de continua?\", \"a\": \"Como un cortocircuito: su corriente es constante y vL = L·di/dt = 0.\", \"extra\": \"Puede conducir corriente y almacenar energía aunque su tensión sea cero. Una bobina real también tiene resistencia.\"}, {\"id\": 89, \"topic\": \"Circuitos RL · teoría\", \"q\": \"¿Qué pasa con corriente y tensión al retirar la fuente y mantener un camino por R?\", \"a\": \"La corriente mantiene su valor inicial y decae: i(t) = I₀e^(−t/τ). El inductor invierte su polaridad respecto del crecimiento para sostenerla.\", \"extra\": \"τ = L/R de la descarga. Con referencia pasiva vL = −Ri; la energía magnética se disipa en R. No confundir con abrir todo camino de corriente.\"}, {\"id\": 91, \"topic\": \"Circuitos RL · teoría\", \"q\": \"¿Qué ocurre si se abre el circuito y no queda un camino de descarga?\", \"a\": \"Puede aparecer una tensión muy alta, capaz de producir una chispa, porque el inductor intenta sostener la corriente.\", \"extra\": \"No se aplica sin más la caída exponencial por R: el comportamiento depende del arco, capacidades parásitas o protecciones.\"}];let P=JSON.parse(localStorage.getItem('Fisica II_p2_v1')||'{}'),deck=[],cur=null,S={n:0,ok:0,streak:0};\nfunction state(id){return P[id]||(P[id]={score:0,seen:0,right:0,wrong:0,next:0,fav:false})}\n[...new Set(cards.map(c=>c.topic))].forEach(t=>{let o=document.createElement('option');o.textContent=t;topic.appendChild(o)});\nfunction priority(c){let x=state(c.id);return x.wrong*100-x.score*12-x.seen*2+(x.next>Date.now()?-60:0)+Math.random()}\nfunction available(){let a=cards.filter(c=>topic.value==='Todos'||c.topic===topic.value),m=mode.value;if(m==='weak')a=a.filter(c=>state(c.id).wrong||state(c.id).score\u003c2);if(m==='fav')a=a.filter(c=>state(c.id).fav);return a}\nfunction build(){let a=available(),m=mode.value;if(m==='smart'||m==='weak')a.sort((a,b)=>priority(b)-priority(a));if(m==='exam')a.sort(()=>Math.random()-.5);deck=a;total.textContent=a.length}\nfunction next(){\n  const previousId=cur?.id;\n  const eligible=available();\n  const ids=new Set(eligible.map(c=>c.id));\n  deck=deck.filter(c=>ids.has(c.id));\n  total.textContent=eligible.length;\n  if(!deck.length)build();\n  // A delayed repeat must never hide another available card.\n  if(deck[0]?.id===previousId&&eligible.some(c=>c.id!==previousId)){\n    if(!deck.some(c=>c.id!==previousId))build();\n    const i=deck.findIndex(c=>c.id!==previousId);\n    deck.unshift(deck.splice(i,1)[0]);\n  }\n  cur=deck.shift();inner.classList.remove('flip');\n  if(!cur){q.textContent='No hay tarjetas en este filtro.';a.textContent='';extra.textContent='';tag.textContent='';s1.textContent=s2.textContent='☆';s1.className=s2.className='star';render();return}\n  q.textContent=cur.q;a.textContent=cur.a;extra.textContent=cur.extra||'Marcá cómo te fue para ajustar el próximo repaso.';tag.textContent=cur.topic;render()\n}\nfunction flip(){inner.classList.toggle('flip')} function save(){localStorage.setItem('Fisica II_p2_v1',JSON.stringify(P))}\nfunction fav(){if(!cur)return;state(cur.id).fav=!state(cur.id).fav;save();render()}\nfunction grade(v){if(!cur)return;let x=state(cur.id);x.seen++;if(v===2){x.right=(x.right||0)+1;x.score=Math.min(5,x.score+1);x.next=Date.now()+86400000*Math.max(1,x.score);S.ok++;S.streak++}else if(v===1){x.next=Date.now()+600000;S.streak=0}else{x.score=0;x.wrong++;x.next=Date.now()+120000;S.streak=0}S.n++;save();\n// Preserve the pending queue; repeat difficult cards after other questions.\nconst eligible=available(),ids=new Set(eligible.map(c=>c.id));\ndeck=deck.filter(c=>ids.has(c.id)&&c.id!==cur.id);\nif(v\u003c2&&ids.has(cur.id)){\n  if(!deck.length){build();deck=deck.filter(c=>c.id!==cur.id)}\n  deck.splice(Math.min(v===0?3:10,deck.length),0,cur);\n}\nnext()}\nfunction render(){answered.textContent=S.n;acc.textContent=(S.n?Math.round(S.ok/S.n*100):0)+'%';streak.textContent='🔥 '+S.streak;bar.style.width=Math.min(100,S.n/25*100)+'%';if(cur){let on=state(cur.id).fav;s1.textContent=s2.textContent=on?'★':'☆';s1.className=s2.className='star '+(on?'on':'')}let ts=[...new Set(cards.map(c=>c.topic))];topicstats.innerHTML=ts.map(t=>{const cs=cards.filter(c=>c.topic===t);const right=cs.reduce((sum,c)=>sum+(state(c.id).right||0),0);const seen=cs.reduce((sum,c)=>sum+state(c.id).seen,0);return `\u003cdiv class=\"tl\">\u003cspan>${t}\u003c/span>\u003cspan title=\"Aciertos / respuestas (mínimo: cantidad de tarjetas)\">${right}/${Math.max(seen,cs.length)}\u003c/span>\u003c/div>`}).join('')}\nfunction rebuild(){build();next()} function newSession(){S={n:0,ok:0,streak:0};build();next()}\ndocument.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flip()}if(e.key==='1')grade(2);if(e.key==='2')grade(1);if(e.key==='3')grade(0);if(e.key.toLowerCase()==='f')fav()});build();next();render();\n\u003c/script>\u003c/body>\u003c/html>"};
const frames={};
function openPartial(number){
if(!frames[number]){const frame=document.createElement('iframe');frame.title='Fisica II · Parcial '+number;frame.srcdoc=documentsByPartial[number];frame.hidden=true;document.getElementById('studies').appendChild(frame);frames[number]=frame}
document.getElementById('welcome').hidden=true;
for(const n of [1,2]){document.getElementById('p'+n).setAttribute('aria-pressed',String(n===number));if(frames[n])frames[n].hidden=n!==number}
frames[number].focus();
}
</script></body></html>
